<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>URL Preview Tool</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 40px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; }
  form { display: flex; gap: 8px; }
  input[type=url] { flex: 1; padding: 10px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  button { padding: 10px 20px; font-size: 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #status { margin: 12px 0; color: #555; min-height: 1.2em; }
  .error { color: #c00; }
  #stage { position: relative; overflow: hidden; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
  #fallback img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔗 URL プレビューツール</h1>
  <form id="f">
    <input type="url" id="url" placeholder="https://example.com" required>
    <button id="btn">表示</button>
  </form>
  <div id="status"></div>
  <div id="stage"></div>
</div>
<script>
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const url = document.getElementById('url').value.trim();
  btn.disabled = true;
  statusEl.textContent = '読み込み中…';
  statusEl.classList.remove('error');
  stage.innerHTML = '';
  try {
    const res = await fetch('/api/shot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = 'エラー: ' + data.error;
      statusEl.classList.add('error');
    } else {
      render(data);
      statusEl.textContent = 'スクリーンショットで表示しています(実サイトには接続していません)。';
    }
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
    statusEl.classList.add('error');
  }
  btn.disabled = false;
});

function render(data) {
  stage.innerHTML = '';
  // 安全のため実サイトの iframe 読み込みは行わず、スクリーンショットのみ表示する
  const div = document.createElement('div');
  div.id = 'fallback';
  const img = document.createElement('img');
  img.src = data.image;
  img.alt = 'screenshot';
  div.appendChild(img);
  stage.appendChild(div);
}
</script>
</body>
</html>
